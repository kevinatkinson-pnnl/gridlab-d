name: Publish Python Bindings to TestPyPI

on:
  push:
    branches:
      - main
      - pypi_build

jobs:
  build-and-publish:
    name: Build wheels (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    environment: testpypi
    permissions:
      id-token: write  # IMPORTANT: Mandatory for trusted publishing
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ['3.10', '3.12', '3.14']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt update -yq
        sudo apt install -yq --no-install-recommends \
          build-essential \
          cmake \
          ninja-build \
          libboost-dev \
          libeigen3-dev \
          nlohmann-json3-dev

    - name: Install System Dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake xerces-c

    - name: Build GridLAB-D Core
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../install ..
        JOBS=$(python -c "import os; print(os.cpu_count() or 2)")
        cmake --build . -j${JOBS}
      # This builds the core libraries that the Python bindings depend on

    - name: Build Python Wheel for Python ${{ matrix.python-version }}
      run: |
        cd python_bindings
        ./prepare_pypi_build.sh
        pip install setuptools wheel twine build
        # Build the wheel
        python -m build

      # This uses pyproject.toml and scikit-build-core to build the wheel
      # It expects to find the built GridLAB-D libraries in ../build/lib

    - name: Repair Linux wheel
      if: runner.os == 'Linux'
      run: |
        cd python_bindings
        pip install auditwheel
        auditwheel repair dist/*.whl -w dist/
        rm -f dist/*-linux_x86_64.whl

    - name: Upload wheel as artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
        path: python_bindings/dist/*.whl

  publish:
    name: Publish all wheels to TestPyPI
    needs: build-and-publish
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write

    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheel-*
        merge-multiple: true
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
        verbose: true
