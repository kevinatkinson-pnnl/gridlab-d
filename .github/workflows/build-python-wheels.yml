name: Build Python Wheels

on:
  push:
    branches:
      - main
      - develop
      - feature/1478
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: all
        options: [all, unix]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'unix' && '[{"os":"ubuntu-24.04","platform":"linux"},{"os":"macos-15","platform":"macos"}]' || '[{"os":"ubuntu-24.04","platform":"linux"},{"os":"macos-15","platform":"macos"},{"os":"windows-2022","platform":"windows"}]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSVC x64 environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.0

      - name: Build GridLAB-D core on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B out/build/ci-windows -G "Visual Studio 17 2022" -A x64
          cmake --build out/build/ci-windows --config Release --parallel 4
      
      - name: Build wheels on Linux and macOS
        if: runner.os != 'Windows'
        run: python -m cibuildwheel python_bindings --output-dir wheelhouse
        env:
          CIBW_SKIP: "*-manylinux_i686 *-musllinux_* *-win32"
          CIBW_TEST_COMMAND: python -c "import gridlabd; print(gridlabd.version()); print(gridlabd.hello()); g = gridlabd.GridLabD(); print(g.get_clock())"
          CIBW_TEST_REQUIRES: numpy

      - name: Build wheels on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m cibuildwheel python_bindings --output-dir wheelhouse
        env:
          CIBW_SKIP: "*-win32"
          CIBW_CONFIG_SETTINGS: "cmake.define.GRIDLABD_BUILD_DIR=${{ github.workspace }}/out/build/ci-windows"
          CIBW_TEST_COMMAND: python -c "import gridlabd; print(gridlabd.version()); print(gridlabd.hello()); g = gridlabd.GridLabD(); print(g.get_clock())"
          CIBW_TEST_REQUIRES: numpy
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: ./wheelhouse/*.whl

  test_windows_abi3:
    if: inputs.platforms != 'unix'
    name: Test Windows ABI3 on Python ${{ matrix.python }}
    needs: [build_wheels]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse
      - name: Install and test the same stable-ABI wheel
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem wheelhouse/*-cp310-abi3-win_amd64.whl)
          if ($wheels.Count -ne 1) { throw "Expected exactly one Windows ABI3 wheel" }
          python -m pip install $wheels[0].FullName pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item python_bindings/tests "$env:RUNNER_TEMP/abi3-tests" -Recurse
          Set-Location $env:RUNNER_TEMP
          python -m pytest abi3-tests/test_simple_load.py abi3-tests/unit/test_initialization.py abi3-tests/test_clock_api.py -q -p no:cacheprovider

  upload_test_pypi:
    name: Upload to Test PyPI
    needs: [build_wheels, test_windows_abi3]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/1478')
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, test_windows_abi3]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
